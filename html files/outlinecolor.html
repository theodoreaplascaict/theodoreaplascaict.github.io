<!DOCTYPE html>
<html>
    <head>
        <title>OUTLINE COLORS</title>
        <style>
            p{
                border: 1px solid black; /*Border size, style and color*/
                padding:5px;
            }
            p.ex1{
                outline-style: solid;
                outline-color: red;
            }
            p.ex2{
                outline-style: dotted;
                outline-color: blue;
            }
            p.ex3{
                outline-style: outset;
                outline-color: green;
            }
            p.ex4{
                outline-style: solid;
                outline-color: invert;
            }
        </style>
        <h2>The Outline-Color Property</h2>
        <p class="ex1">A solid red outline</p>
        <p class="ex2">A dotted blue outline</p>
        <p class="ex3">An outset violet outline</p>
        <p class="ex4">A solid invert outline</p>
    </head>
</html>
