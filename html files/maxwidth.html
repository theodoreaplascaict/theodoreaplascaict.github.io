<!DOCTYPE html>
<html>
    <head>
        <style>
            div.ex1{
                width: 300px;
                margin: 10px;
                padding: 25px;
                border: 15px solid black;
            }
            div.ex2{
                width: 100px;
                max-width: 400px;
                margin: 10px;
                padding: 10px;
                border: 15px solid black;
            }
        </style>
    </head>
    <body>
        <h2>CSS Max-Width</h2>
        <div class="ex1"></div>
        <br>
        <div class="ex2"></div>
    </body>
</html>
