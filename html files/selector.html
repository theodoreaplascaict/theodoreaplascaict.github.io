<!DOCTYPE html>
<html>
    <head>
        <title>Type Selector Demo</title>
        <style>
            h1 {
                color: blue;
                text-align: center;
            }
            p {
                font-size: 20px;
                color: green;
            }

            li{
                color:green;
            }
            h2{
                color:darkblue;
                font-size:20px;
            }
        </style>
    </head>
    <body>
        <h1>Type Selector</h1>
        <p>This is a paragraph demonstrating the type selector in CSS.</p>
        <p>Another Paragraph</p>
        <ul>
            <li>First item (green)</li>
            <li>Second item (green)</li>
        </ul>
        <h2>Paragraph Example</h2>
        <h2>Paragraph Example 2</h2>
    </body>
</html>
